name: Gate report check
description: Require a complete, passing pre-push gate report bound to this commit

inputs:
  sha:
    description: The commit the report must be bound to
    required: false
    default: ${{ github.sha }}
  gates:
    description: File listing the gates that must be present and passing
    required: false
    default: .githooks/gates/enabled
  gate-config:
    description: The rendered gate-config, which declares the refs a required gate may be skipped on
    required: false
    default: .githooks/gate-config
  before:
    description: The branch tip before this push (for a pull request update, its previous head); empty for a manual run or a new branch
    required: false
    default: ${{ github.event.before }}
  ref:
    description: The pull request base ref, or for a push the pushed ref; a ref the profile declares exempt may skip the gates it names
    required: false
    default: ${{ github.base_ref || github.ref }}

runs:
  using: composite
  steps:
    # Values reach shell only through env. A ${{ }} inside run: is pasted into the
    # script text, which is how data becomes code.
    - name: Fetch the report published for this commit
      id: fetch
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
      run: bash "$GITHUB_ACTION_PATH/fetch.sh"

    # Gates the profile lists as report-rerun= are run here, from the core release it
    # vendored, so their verdict does not rest on the pushing machine's word. With no such
    # line this does nothing. A fetch that fails fails the step.
    - name: Run the listed gates again from the vendored core
      if: steps.fetch.outputs.found == 'yes'
      shell: sh
      env:
        SHA: ${{ inputs.sha }}
        BEFORE: ${{ inputs.before }}
        GATE_CONFIG: ${{ inputs.gate-config }}
      run: sh "$GITHUB_ACTION_PATH/rerun.sh"

    - name: Every required gate must be present, passing, and bound to this commit
      shell: bash
      env:
        FOUND: ${{ steps.fetch.outputs.found }}
        SHA: ${{ inputs.sha }}
        GATES: ${{ inputs.gates }}
        GATE_CONFIG: ${{ inputs.gate-config }}
        BEFORE: ${{ inputs.before }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail

        if [ "$FOUND" != "yes" ]; then
          # A merge made in the web UI ran no hook and has no report. It is accepted
          # only as a clean merge of two covered parents. Output is held so a pass does
          # not read as a refusal. History the branch held before this push is the base
          # case: it was judged when it landed.
          if cover="$(python3 "$GITHUB_ACTION_PATH/gate_report.py" \
            --merge-cover \
            --sha "$SHA" \
            --before "$BEFORE" \
            --gates "$GATES" 2>&1)"; then
            echo "No gate report for $SHA."
            echo "$cover"
            exit 0
          fi

          echo "REFUSED: no gate report for $SHA."
          echo ""
          echo "A pre-push hook that ran publishes one. A hook that was skipped"
          echo "does not, and this gate cannot tell those apart - so both fail."
          echo ""
          echo "If the hook is not installed, run sync.py against this repo."
          echo ""
          echo "$cover"
          exit 1
        fi

        python3 "$GITHUB_ACTION_PATH/gate_report.py" \
          --report "$RUNNER_TEMP/report.json" \
          --sha "$SHA" \
          --gates "$GATES" \
          --gate-config "$GATE_CONFIG" \
          --ref "$REF" \
          --rerun "$RUNNER_TEMP/rerun.txt"
