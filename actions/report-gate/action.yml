# Description: Fetches the pre-push gate report for a commit and validates it.
#              Used by the report-gate workflow, and by any deploy that must
#              not run on an ungated commit. Absence is failure: a skipped hook
#              publishes no report, and a report bound to a different commit is
#              treated exactly like a missing one. A skipped required gate is
#              accepted only where the profile declared an exemption for it.
