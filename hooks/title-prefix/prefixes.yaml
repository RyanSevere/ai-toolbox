# A title is "<prefix> - <session name>". The first entry that matches the prefix wins, so
# "pending push", "pending workers" and "pending ci" must precede "pending <name>". An entry names its prefix literally
# (prefix:) or as a regular expression matched against the whole prefix (label: names it
# for a reader, pattern: is the expression).
# Rules: ask = the reply must carry an open ask (a "## Decisions and clarifications" or
# "## Operator steps" heading after the reply marker); no-ask = it must not; unchecked = not
# graded. A title that matches no entry is not graded.
prefixes:
  - prefix: needs you
    rule: ask
  - prefix: holding pending desk
    rule: unchecked
  - prefix: pending push
    rule: no-ask
  # Waiting on the session's own workers to finish what it handed them.
  - prefix: pending workers
    rule: no-ask
  # Waiting on the session's own pull request's checks, or a background task it started.
  - prefix: pending ci
    rule: no-ask
  - label: "pending <name>"
    pattern: "pending .+"
    rule: no-ask
  # The workstream's objective is done, nothing is pending, ready for cleanup and archive.
  - prefix: complete
    rule: no-ask
  # Something unattended, named by <x>, runs overnight and the session resumes on it in
  # the morning. An ask held for the morning is "holding pending desk", never this.
  - label: "overnight <x>"
    pattern: "overnight .+"
    rule: no-ask
  - label: "parked until <x>"
    pattern: "parked until .+"
    rule: unchecked
  # Set by a primary as its first call of every turn and replaced before the reply, so a
  # title that still reads "working" after the turn ended means the turn was cut off.
  - prefix: working
    rule: unchecked
