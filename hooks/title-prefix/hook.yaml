# A session title's status prefix is graded against the reply every turn. An observer: the
# hook's own failure never blocks. The vocabulary is prefixes.yaml, rendered beside hook.py;
# a profile replaces it whole with a title_prefixes list in its profile file.
event: turn.end
kind: observer
tools: [claude]
run: ["{python}", "{hooks}/title-prefix/hook.py"]
timeout: 30
