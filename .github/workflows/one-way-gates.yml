# Description: One-way gates 1 and 4 in CI. Refuses a change whose added lines
#              match the secret leak denylist, and a tree that names anything
#              on the secret core-names list. Both lists come from repository
#              secrets, which GitHub withholds from fork pull requests, so the
#              gates run there only after the change reaches dev or main.
