name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate VERSION and the tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::VERSION must be X.Y.Z with no leading zeros (leading zeros are refused), got '$version'."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists. Bump VERSION to release again."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create and push the annotated tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898182+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$GITHUB_SHA" -m "v$VERSION"
          git push origin "v$VERSION"
