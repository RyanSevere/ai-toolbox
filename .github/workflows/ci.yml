name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.x']
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install pyyaml
      - name: Set a git identity for tests that commit in temporary repositories
        run: |
          set -euo pipefail
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Run shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python tests/run_shard.py ${{ matrix.shard }}

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks, verified against the release checksums
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 -O "${base}/${asset}"
          curl --fail --silent --show-error --location --max-time 120 -O "${base}/${sums}"
          grep -F " ${asset}" "$sums" > expected.sha256
          test "$(wc -l < expected.sha256)" -eq 1
          sha256sum --check expected.sha256
          tar -xzf "$asset" gitleaks
      - name: Scan the full history
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
