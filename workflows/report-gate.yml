name: Gate report

on:
  push:
    # branches is not optional here. A push: block carrying only tags-ignore
    # stops the workflow firing on branch pushes at all.
    branches:
      - '**'
    # The report itself is a tag. Without this the gate would run a second time
    # for the report of the push it is already gating.
    tags-ignore:
      - 'gate-report/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Gates re-run from the core read the range before..sha, and a shallow clone
          # has neither the pushed head of a pull request nor the commit before it.
          fetch-depth: 0
      - uses: ./.github/actions/report-gate
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
